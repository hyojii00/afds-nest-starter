packages:
  - apps/*
  - packages/*

autoInstallPeers: false

# Keep SWC watch on its supported peer without replacing Nest/Angular's Chokidar 4.
packageExtensions:
  '@swc/cli@0.8.1':
    dependencies:
      chokidar: 5.0.0

allowBuilds:
  '@biomejs/biome': true
  '@confluentinc/kafka-javascript': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
