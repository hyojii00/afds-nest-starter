services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - '127.0.0.1:9092:9092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 5s
      timeout: 10s
      retries: 12
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: afds_nest_starter
      POSTGRES_USER: afds
      POSTGRES_PASSWORD: afds
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afds -d afds_nest_starter']
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
